name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ENIAC.SystemTuner.slnx

      - name: Build solution
        run: dotnet build ENIAC.SystemTuner.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet run --project csharp/src/ENIAC.Tuner.Tests/ENIAC.Tuner.Tests.csproj --configuration Release
